name: Test IA

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Probe Internet Archive S3
        env:
          RCLONE_CONFIG_IA_TYPE: s3
          RCLONE_CONFIG_IA_PROVIDER: Other
          RCLONE_CONFIG_IA_ENDPOINT: https://s3.us.archive.org
          RCLONE_CONFIG_IA_REGION: us-east-1
          RCLONE_CONFIG_IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY }}
          RCLONE_CONFIG_IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          echo "access-key length: ${#RCLONE_CONFIG_IA_ACCESS_KEY_ID}"
          echo "secret-key length: ${#RCLONE_CONFIG_IA_SECRET_ACCESS_KEY}"
          rclone lsd IA: || true
          rclone lsl IA:blueshift-linux-isos || true
