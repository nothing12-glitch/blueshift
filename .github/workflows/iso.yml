name: Build ISO

on:
  workflow_dispatch:
  # автоматично після успішної збірки образу — не чекаємо ручного запуску
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  iso:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build Anaconda ISO
        run: |
          mkdir -p output auth
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s' '${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}' | base64 -w0)" > auth/auth.json
          sudo podman pull --authfile auth/auth.json \
            "ghcr.io/${{ github.repository_owner }}/blueshift:latest"
          sudo podman run --rm --privileged --pull=newer \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output":/output \
            -v "$PWD/auth/auth.json":/root/.config/containers/auth.json:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs xfs \
            "ghcr.io/${{ github.repository_owner }}/blueshift:latest"

      - name: Rename, checksum and sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          cd output/bootiso
          DATE=$(date -u +%Y%m%d)
          for iso in *.iso; do mv "$iso" "blueshift-${DATE}-${iso}"; done
          sha256sum *.iso | tee "blueshift-${DATE}-CHECKSUM"
          cosign sign-blob -y --key env://SIGNING_KEY "blueshift-${DATE}-CHECKSUM" --bundle "blueshift-${DATE}-CHECKSUM.bundle"

      - name: Upload to Internet Archive
        env:
          # рідний бекенд rclone: IA приймає на запис LOW-автентифікацію, не SigV4
          RCLONE_CONFIG_IA_TYPE: internetarchive
          RCLONE_CONFIG_IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY }}
          RCLONE_CONFIG_IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          cd output/bootiso
          # --ignore-times: бекенд internetarchive не підтримує mtime, тож rclone
          # порівнює лише розмір і пропускає однойменні файли однакового розміру
          rclone copy . IA:blueshift-linux-isos/ --ignore-times \
            --header-upload "x-archive-meta-mediatype:software" \
            --header-upload "x-archive-meta-title:BlueShift Linux ISO" \
            --header-upload "x-archive-meta-description:Bootable installer ISO for BlueShift Linux, a Fedora Atomic gaming distribution. Source: https://github.com/nothing12-glitch/blueshift" \
            --header-upload "x-archive-meta-subject:linux;gaming;fedora;bluebuild"
          {
            echo "## BlueShift ISO ready"
            echo ""
            for f in *; do echo "- https://archive.org/download/blueshift-linux-isos/$f"; done
          } >> "$GITHUB_STEP_SUMMARY"
