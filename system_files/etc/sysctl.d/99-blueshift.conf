# BlueShift Linux gaming tweaks
# Wine/Proton та ігри з великою кількістю mmap-областей (EAC, BattlEye)
vm.max_map_count = 2147483642
# File watchers для великих ігрових бібліотек (Steam/Heroic/Lutris)
fs.inotify.max_user_watches = 524288
# Менше агресивний swap — пріоритет RAM для ігор
vm.swappiness = 10
